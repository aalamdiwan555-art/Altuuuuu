name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore smartautoclicker/debug.keystore || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Building with SUPABASE_URL length: ${#SUPABASE_URL}"
          ./gradlew :smartautoclicker:assembleFDroidDebug --no-daemon --stacktrace \
            -PsupabaseUrl="$SUPABASE_URL" \
            -PsupabaseAnonKey="$SUPABASE_ANON_KEY" \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Altuuuuu-debug-apk
          path: |
            smartautoclicker/build/outputs/apk/fDroid/debug/*.apk
            smartautoclicker/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/**/*.apk
